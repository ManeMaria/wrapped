name: Deploy Workflow - Wrapped 2025
run-name: Deploy Workflow - Wrapped 2025

on:
  push:
    branches:
      - wrapped-2025

jobs:
  deploy-workflow-wrapped-2025:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Git
        env:
          GITHUB_USER: ${{ secrets.LOOMI_DEV_USERNAME }}
          GITHUB_EMAIL: ${{ secrets.LOOMI_DEV_EMAIL }}
        run: |
          git config --global user.name "$GITHUB_USER"
          git config --global user.email "$GITHUB_EMAIL"

      - name: Check if deploy.txt exists
        run: |
          if [ ! -f .github/develop-deploy.txt ]; then touch .github/develop-deploy.txt; fi

      - name: Update deploy file register
        run: |
          timestamp=$(date +'%d-%m-%Y %H:%M:%S')
          branch=$(git rev-parse --abbrev-ref HEAD)
          content="Deploy triggered at $timestamp"
          printf "%s\n%s\n" "$content" "$(cat .github/develop-deploy.txt)" > temp.txt && mv temp.txt .github/develop-deploy.txt

      - name: Commit Changes
        run: |
          git add .
          git commit -m "ci: update deploy log"

      - name: Create Pull Request for deploy update
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          title: "ci: trigger vercel deploy"
          body: "This PR triggers a Vercel deployment. Auto-generated by the deploy workflow."
          branch: "ci/release"
          base: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Pull Request
        run: gh pr merge --squash --auto "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}